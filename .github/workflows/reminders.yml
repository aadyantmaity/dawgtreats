name: Pickup day reminders

# Pickups only happen Saturday and Sunday. GitHub cron is UTC and ignores daylight
# saving, so 15:00 UTC lands at 8am PDT in summer and 7am PST in winter - early
# enough on either side of the switch to reach everyone before the first slot.
on:
  schedule:
    - cron: "0 15 * * 6,0"
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-24.04
    steps:
      - name: Send pickup day reminders
        run: |
          response=$(curl -sS --fail-with-body -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://dawgtreats.shop/api/cron/reminders)
          echo "$response"

  # The same run against staging, which sends nothing: no mail key is set there, so the
  # job proves the path works without a customer ever hearing from it.
  staging:
    runs-on: ubuntu-24.04
    if: vars.STAGING_URL != ''
    steps:
      - name: Run the reminder pass on staging
        run: |
          response=$(curl -sS --fail-with-body -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.STAGING_CRON_SECRET }}" \
            "${{ vars.STAGING_URL }}/api/cron/reminders")
          echo "$response"
