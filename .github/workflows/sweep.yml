name: Hourly order sweep

# Stripe retries webhooks, but one that never lands would hold stock until the week ends.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-24.04
    steps:
      - name: Reconcile stuck orders against Stripe
        run: |
          response=$(curl -sS --fail-with-body -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://dawgtreats.shop/api/cron/sweep)
          echo "$response"

  # Staging holds stock the same way, so it needs sweeping the same way. Skipped entirely
  # until STAGING_URL names a site, so the schedule is harmless before staging exists.
  staging:
    runs-on: ubuntu-24.04
    if: vars.STAGING_URL != ''
    steps:
      - name: Reconcile stuck orders on staging
        run: |
          response=$(curl -sS --fail-with-body -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.STAGING_CRON_SECRET }}" \
            "${{ vars.STAGING_URL }}/api/cron/sweep")
          echo "$response"
