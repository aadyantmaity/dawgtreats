name: Hourly order sweep

# Stripe retries webhooks, but one that never lands would hold stock until the week ends.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile stuck orders against Stripe
        run: |
          response=$(curl -sS --fail-with-body -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://dawgtreats.shop/api/cron/sweep)
          echo "$response"
