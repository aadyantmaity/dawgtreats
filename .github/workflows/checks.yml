name: Checks

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04

    # The suite runs against a real Postgres, never a mock: the reservation logic it
    # covers is conditional SQL, and a mock would prove nothing about it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dawgtreats
          POSTGRES_DB: dawgtreats_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # PageProps, LayoutProps and RouteContext are generated by Next, so a clean
      # checkout has none of them and tsc fails before it reads a line of our code.
      - name: Generate route types
        run: npx next typegen

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:dawgtreats@localhost:5433/dawgtreats_test

      # Only Chromium: this catches layout breakage, not cross-browser rendering bugs.
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      # Seeds its own menu and opens a week against the same throwaway Postgres the
      # suite uses, then builds and starts the app (playwright.config.ts) before
      # checking every route for sideways scroll, off-screen elements, a reachable
      # cart link and tap targets, at phone widths. See e2e/layout.spec.ts.
      - name: Layout
        run: npm run e2e
        env:
          TEST_DATABASE_URL: postgres://postgres:dawgtreats@localhost:5433/dawgtreats_test

      # knip's drizzle plugin loads drizzle.config.ts, which needs a database URL
      # this job has no reason to hold. The plugin is off and the config ignored.
      - name: Dead code
        run: npm run knip

      - name: Duplication
        run: npm run duplication

      - name: Build
        run: npm run build
        env:
          # lib/db throws at import without this. Nothing is queried while building,
          # so the throwaway container is enough to satisfy it.
          DATABASE_URL: postgres://postgres:dawgtreats@localhost:5433/dawgtreats_test
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
